# .github/workflows/contractguard.yml
#
# This is ALL a consuming project needs — the actual scanning logic lives
# in the contractguard-action repo, referenced below by tag.

name: APISentry

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'

jobs:
  contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: souryeahdeep/apisentry-action@v1
        with:
          consumer-dirs: |
            frontend/official_frontend/src
            frontend/student_frontend/src