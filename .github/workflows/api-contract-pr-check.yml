# .github/workflows/api-contract-pr-check.yml
#
# Runs on every PR targeting main. Generates the OpenAPI spec for the
# PR branch, compares it against the committed baseline (openapi/spec.json
# on main), and comments + fails the check if there are breaking changes.

name: API Contract Guard — PR Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'build.gradle'

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to read openapi/spec.json from origin/main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: mvn -B -q -DskipTests package

      - name: Start application (CI profile)
        run: |
          nohup java -jar target/*.jar \
            --spring.profiles.active=ci \
            --server.port=8080 > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application to be ready
        run: |
          chmod +x ci/wait-for-http.sh
          ci/wait-for-http.sh http://localhost:8080/v3/api-docs 60

      - name: Generate current OpenAPI spec
        run: mkdir -p openapi && curl -sf http://localhost:8080/v3/api-docs -o openapi/spec-current.json

      - name: Stop application
        if: always()
        run: kill "$(cat app.pid)" || true

      - name: Fetch baseline spec from main
        run: git show origin/main:openapi/spec.json > openapi/spec-baseline.json

      - name: Install oasdiff
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Detect breaking changes
        id: breaking
        run: |
            set +e
            oasdiff breaking openapi/spec-baseline.json openapi/spec-current.json -f text --fail-on ERR > breaking-changes.txt
            exit_code=$?
            set -e
            echo "Exit code from oasdiff: $exit_code"
            cat breaking-changes.txt
            if [ "$exit_code" -ne 0 ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi

      - name: Generate full changelog for context
        if: steps.breaking.outputs.found == 'true'
        run: oasdiff changelog openapi/spec-baseline.json openapi/spec-current.json -f markdown > changelog.md || true

      - name: Format PR comment
        if: steps.breaking.outputs.found == 'true'
        run: |
          {
            echo "## ⚠️ Breaking API changes detected"
            echo ""
            echo "This PR changes the API contract in a way that may break existing consumers (React app, other services calling this API)."
            echo ""
            echo '```'
            cat breaking-changes.txt
            echo '```'
            echo ""
            echo "<details><summary>Full changelog</summary>"
            echo ""
            cat changelog.md
            echo ""
            echo "</details>"
          } > pr-comment.md

      - name: Post PR comment
        if: steps.breaking.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-comment.md
          edit-mode: replace

      - name: Fail check if breaking changes found
        if: steps.breaking.outputs.found == 'true'
        run: |
          echo "::error::Breaking API changes detected — see the PR comment for details."
          exit 1